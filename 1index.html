<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navidix | تکنولوژی و هوش مصنوعی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هدر سایت -->
    <header>
        <div class="logo">Navidix<span>Studio</span></div>
        <nav>
            <a href="#news">اخبار و مقالات</a>
            <a href="#youtube">کانال یوتیوب</a>
        </nav>
    </header>

    <!-- بخش اخبار و مقالات (اسکرول افقی) -->
    <section id="news" class="container">
        <h2>🔥 آخرین اخبار هوش مصنوعی و تکنولوژی</h2>
        <p class="subtitle">برای دیدن اخبار بیشتر به سمت چپ بکشید (اسکرول افقی)</p>
        
        <div class="horizontal-scroll" id="articles-container">
            <!-- مقالات به صورت خودکار توسط JavaScript اینجا بارگذاری می‌شوند -->
            <div class="card loading-card">در حال دریافت جدیدترین اخبار...</div>
        </div>
    </section>

    <!-- بخش ویدیوهای یوتیوب -->
    <section id="youtube" class="container">
        <h2>📺 جدیدترین ویدیوهای یوتیوب</h2>
        <div class="grid-container" id="youtube-container">
            <!-- ویدیوهای یوتیوب اینجا بارگذاری می‌شوند -->
        </div>
    </section>

    <footer>
        <p>© 2026 Navidix - تمامی حقوق محفوظ است.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
