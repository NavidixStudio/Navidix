<style>
@font-face{font-family:'Estedad';src:url('/assets/estedad-var.woff2')format('woff2');

@font-face{font-family:'Inter';src:url('/assets/inter-var.woff2')format('woff2');
  font-weight:100 900;font-display:swap;font-style:normal}

:root{--bg:#08090B;--pane:#11151B;--line:#262A31;--ink:#EDF2FA;--ink2:#C8D0DA;
  --mute:#8C939B;--dim:#6B7280;--ember:#E5202A;--link:#7FB8FF}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:'Estedad','IRANSans',Tahoma,sans-serif;font-size:15px;line-height:1.9;
  -webkit-font-smoothing:antialiased}
.lat{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}

.sitebar{border-bottom:1px solid var(--line);background:rgba(8,9,11,.9);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.sitebar .row{max-width:1080px;margin:0 auto;padding:13px 22px;
  display:flex;align-items:center;gap:14px}
.sitebar a{color:var(--mute);text-decoration:none;font-size:13px}
.sitebar a:hover{color:var(--ink)}
.home{display:flex;align-items:center;gap:9px;color:var(--ink)!important;
  font-weight:700;letter-spacing:.16em;font-size:12.5px}
.sp{flex:1}

/* nvx-topbar.js replaces .sitebar with a position:fixed bar and adds no
   top padding of its own, so 55px of every page sits under it. Pages
   with a tall hero never notice; this one opens on a single small line
   and lost it entirely. The bar's height plus the breathing room the
   page wanted in the first place. */
.wrap{max-width:1080px;margin:0 auto;padding:93px 22px 90px}
.eyebrow{font-size:11.5px;letter-spacing:.2em;color:var(--dim);margin:0 0 10px}
h1{font-size:clamp(24px,3.6vw,34px);font-weight:700;margin:0 0 8px;line-height:1.5}
.sub{color:var(--mute);font-size:14px;margin:0 0 6px;line-height:2}

.empty{color:var(--dim);font-size:13.5px;line-height:2.1;
  border:1px dashed var(--line);border-radius:14px;padding:26px 22px;margin:26px 0}
.empty b{color:var(--ink2);display:block;font-weight:700;margin-bottom:4px}

@media (max-width:640px){.wrap{padding:81px 15px 70px}}
</style>

<!-- فهرست کناری صفحه. فقط روی صفحه‌ی بلند و نمایشگر عریض ظاهر می‌شود
     و روی گوشی اصلاً ساخته نمی‌شود. -->
<script src="nvx-outline.js" defer></script>

<body>

<header class="sitebar"><div class="row">  <a class="home" href="index.html"><img class="navmark" src="navidix-mark.png" alt="" width="24" height="24" /><span>NAVIDIX</span></a>
  <span class="sp"></span>
  <a href="index.html">صفحه‌ی اصلی ←</a>
</div></header>

<main class="wrap">
  <p class="eyebrow lat">NAVIDIX · ARTICLES</p>
  <h1>مقاله‌ها</h1>
  <p class="sub">نوشته‌های استودیو درباره‌ی هوش مصنوعی، ابزارها و تولید محتوا.</p>

  <!-- The whole page. data-nvx-keep is what keeps this node in the
       document when nothing is published yet, so the note below it can
       explain the emptiness instead of the page ending after the
       subtitle. -->
  <div data-nvx="articles" data-nvx-keep></div>

  <div class="empty" id="note" hidden>
    <b>هنوز مقاله‌ای منتشر نشده.</b>
    اولین مقاله را از پنل مدیریت بساز و منتشر کن — همان لحظه اینجا ظاهر می‌شود.
  </div>
</main>

<script>
/* The note is shown only for a genuinely empty list, not for a list that
   failed to load. Those are different things: one is a site with no
   articles yet, the other is a reader whose network dropped, and telling
   the second reader that nothing has been written is a lie. */
(function () {
  var host = document.querySelector('[data-nvx="articles"]');
  var note = document.getElementById('note');
  if (!host || !note) return;

  var check = function () {
    if (host.getAttribute('data-nvx-state') === 'empty') note.hidden = false;
  };

  new MutationObserver(check).observe(host, {
    attributes: true, attributeFilter: ['data-nvx-state']
  });
  check();
})();
</script>
</body>
