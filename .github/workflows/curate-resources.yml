name: Curate YouTube resources

# دستی اجرا می‌شود. عمداً زمان‌بندی خودکار ندارد: کاری که هر بار یک Pull
# Request باز می‌کند و منتظر آدم می‌ماند، اگر هفتگی خودش اجرا شود فقط صف
# درست می‌کند.
on:
  workflow_dispatch:
    inputs:
      lessons:
        description: 'شناسه‌ی درس‌ها با فاصله — خالی یعنی هر درسی که هنوز منبع ندارد'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # جمینای پیشنهاد می‌دهد، یوتیوب تأیید می‌کند. هر لینکی که oEmbed نپذیرد
      # کنار گذاشته می‌شود، و عنوان و کانال از یوتیوب برداشته می‌شود نه از
      # مدل. جزئیاتش در tools/curate.py نوشته شده.
      - name: پیشنهاد و تأیید منابع
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/curate.py ${{ inputs.lessons }}

      - name: ساختن بخش منابع
        run: python3 tools/resources.py --fetch

      # هر خط اینجا باید تورفتگی داشته باشد. متن بلندِ چندخطی که از ستون صفر
      # شروع شود بلوک را می‌بندد و کل فایل را از نظر YAML خراب می‌کند — که
      # همان چیزی است که بار اول اتفاق افتاد و job اصلاً ساخته نشد. برای همین
      # متن Pull Request در .github/resources-pr.md است و با --body-file
      # خوانده می‌شود، و پیام commit با چند تا -m ساخته می‌شود.
      - name: باز کردن Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "چیزی تأیید نشد — Pull Requestی لازم نیست."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="resources/$(date +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git add -A
          git commit \
            -m "Propose YouTube resources for the lessons that had none" \
            -m "Every URL here came back verified: Gemini proposed it with Google Search on, and the link was then checked against YouTube's oEmbed before being kept. Anything oEmbed refused — deleted, private, or invented — was dropped rather than written down." \
            -m "The titles and channel names are YouTube's own, not the model's. The only thing the model contributed that survives is the one-line reason each video is here, which is a judgement rather than a fact that can be faked. Read those before merging."
          git push -u origin "$BRANCH"
          gh pr create \
            --title "منابع یوتیوب پیشنهادی — $(date +%Y-%m-%d)" \
            --body-file .github/resources-pr.md
