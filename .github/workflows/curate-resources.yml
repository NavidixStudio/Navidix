name: Curate YouTube resources

# دستی اجرا می‌شود. عمداً زمان‌بندی خودکار ندارد: کاری که هر بار یک Pull
# Request باز می‌کند و منتظر آدم می‌ماند، وقتی هفته‌ای یک بار خودش اجرا شود
# فقط صف درست می‌کند.
on:
  workflow_dispatch:
    inputs:
      lessons:
        description: 'شناسه‌ی درس‌ها با فاصله — خالی یعنی هر درسی که هنوز منبع ندارد'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # جمینای پیشنهاد می‌دهد، یوتیوب تأیید می‌کند. هر لینکی که oEmbed
      # نپذیرد کنار گذاشته می‌شود، و عنوان و کانال از یوتیوب برداشته
      # می‌شود نه از مدل. جزئیاتش در tools/curate.py نوشته شده.
      - name: پیشنهاد و تأیید منابع
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 tools/curate.py ${{ inputs.lessons }}

      # عنوان‌ها را در کش بگذار و بخش را در صفحات درس بساز
      - name: ساختن بخش منابع
        run: python3 tools/resources.py --fetch

      - name: باز کردن Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "چیزی تأیید نشد — Pull Requestی لازم نیست."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="resources/$(date +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git add tools/resources.py tools/resources.json nvx-training.css *.html
          git commit -m "Propose YouTube resources for the lessons that had none

Every URL in here came back verified: Gemini proposed it with Google
Search on, and the link was then checked against YouTube's oEmbed before
being kept. Anything oEmbed refused — deleted, private, or invented — was
dropped rather than written down. The titles and channel names are
YouTube's own, not the model's; the only thing the model contributed that
survives is the one-line reason each video is here, which is a judgement
rather than a fact that can be faked.

Read those reasons before merging. If one of them could have been written
without watching the video, it probably was."

          git push -u origin "$BRANCH"

          gh pr create \
            --title "منابع یوتیوب پیشنهادی — $(date +%Y-%m-%d)" \
            --body "$(cat <<'EOF'
پیشنهاد خودکار منابع یوتیوب برای درس‌هایی که منبع نداشتند.

### پیش از merge این‌ها را نگاه کن

- [ ] هر ویدیو را باز کن و ببین واقعاً همان درس را می‌گوید، نه موضوع کلی‌اش
- [ ] جمله‌ی «چرا این ویدیو» را بخوان — اگر عمومی است و می‌شد بدون دیدن ویدیو نوشتش، خودت بازنویسی کن
- [ ] سطح (مقدماتی / متوسط / پیشرفته) با محتوا بخواند
- [ ] ویدیوی خیلی قدیمی در حوزه‌ی AI را حذف کن

### چه چیزی از قبل بررسی شده

هر لینک با oEmbed یوتیوب تأیید شده، پس ویدیوی حذف‌شده یا خصوصی یا شناسه‌ی
ساختگی اصلاً به اینجا نرسیده. عنوان و نام کانال هم از خود یوتیوب آمده، نه از مدل.

### چه چیزی بررسی نشده

اینکه ویدیو **خوب** است یا نه. آن قضاوت است و کار توست.

---
_Generated by [Claude Code](https://claude.ai/code)_
EOF
)"
