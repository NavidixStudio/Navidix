<style>
/* =====================================================================
   NAVIDIX — FOUNDATION V1
   One file. Modular by registry, not by convention.
   ASSET SWAP POINT → NAVIDIX.config.assets in the script below.
   ===================================================================== */

:root{
  /* palette — absolute black ground, blue starlight, brand crimson */
  --void:        #000000;
  --ink:         #04060B;
  --nebula-deep: #08132B;
  --nebula-glow: #2B6CFF;
  --ion:         #8FDBFF;
  --ember:       #E31B23;
  --ember-soft:  #FF6A5A;
  --paper:       #EDF2FA;
  --paper-dim:   rgba(237,242,250,.52);
  --paper-ghost: rgba(237,242,250,.16);
  --glass-edge:  rgba(170,205,255,.15);

  /* type */
  --f-display: "Sora","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --f-ui:      "Inter","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --f-fa:      "Vazirmatn","IRANSansX","IRANSans","Segoe UI",Tahoma,sans-serif;

  --gutter: clamp(18px, 4vw, 68px);
  --ease: cubic-bezier(.16,1,.3,1);
  --logo-bottom: 46vh;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:var(--void); color:var(--paper);
  font-family:var(--f-ui);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
html[lang="fa"] body{ font-family:var(--f-fa); }

/* ---------- layers ---------- */
#stage{ position:fixed; inset:0; z-index:0; }
#stage canvas{ display:block; width:100%; height:100%; }

.grade{ position:fixed; inset:0; z-index:1; pointer-events:none; }
.grade--vignette{
  background:
    radial-gradient(118% 82% at 50% 34%, transparent 40%, rgba(0,0,0,.62) 76%, #000 100%),
    linear-gradient(to bottom, rgba(0,0,0,.5) 0%, transparent 20%);
}
.grade--grain{
  opacity:.10; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.5'/></svg>");
}

/* ---------- shell ---------- */
#shell{ position:relative; z-index:2; }
.landing{
  min-height:100svh;
  display:flex; flex-direction:column;
  padding:0 var(--gutter) clamp(20px,3.4vh,42px);
}

/* ---------- language switch ---------- */
.lang{
  position:fixed; top:clamp(16px,2.4vh,30px); inset-inline-end:var(--gutter);
  z-index:6; display:flex; align-items:center; gap:12px;
  opacity:0;
}
.lang button{
  appearance:none; background:none; border:0; padding:2px 1px; cursor:pointer;
  color:var(--paper-ghost);
  font-family:var(--f-ui); font-size:11px; font-weight:500;
  letter-spacing:.26em; text-transform:uppercase;
  transition:color .45s var(--ease);
}
.lang button[data-fa]{ font-family:var(--f-fa); letter-spacing:.06em; font-size:12px; }
.lang button:hover{ color:var(--paper-dim); }
.lang button[aria-current="true"]{ color:var(--paper); }
.lang .sep{ width:1px; height:11px; background:var(--paper-ghost); }
.lang button:focus-visible{ outline:1px solid var(--ion); outline-offset:4px; }

/* ---------- hero ---------- */
.hero{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  text-align:center;
  /* JS measures where the 3D mark ends and hands the number back here */
  padding-top:calc(var(--logo-bottom) + clamp(38px,7.5vh,104px));
  padding-bottom:clamp(24px,5vh,64px);
}
/* the wordmark sits on a plate of light — a title card, not a floating image */
.plate{ position:relative; display:flex; justify-content:center; width:100%; }
.plate::before{
  content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(820px,96vw); height:min(260px,34vh); pointer-events:none;
  background:
    radial-gradient(52% 46% at 50% 50%, rgba(143,219,255,.11), transparent 72%),
    radial-gradient(30% 30% at 50% 62%, rgba(227,27,35,.09), transparent 74%);
}
.wordmark{
  position:relative; display:block; width:min(378px,60vw); height:auto; opacity:0;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.18)) drop-shadow(0 0 46px rgba(143,219,255,.2));
}
.tagline{
  margin:clamp(14px,2.2vh,22px) 0 0;
  font-family:var(--f-ui);
  font-size:9.5px; font-weight:500; letter-spacing:.42em; text-transform:uppercase;
  color:var(--paper-dim); opacity:0;
}
html[lang="fa"] .tagline{
  font-family:var(--f-fa); font-size:12.5px; font-weight:400;
  letter-spacing:.02em; text-transform:none;
}

/* one line that says what is sold, then the only two actions that matter */
.pitch{
  margin:clamp(18px,3.2vh,34px) 0 0; max-width:34ch; opacity:0;
  font-family:var(--f-display); font-weight:200;
  font-size:clamp(15px,1.6vw,23px); line-height:1.55; letter-spacing:-.004em;
  color:rgba(237,242,250,.9); text-wrap:balance;
}
html[lang="fa"] .pitch{ font-family:var(--f-fa); font-weight:300; letter-spacing:0; line-height:1.95; }
.cta-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:clamp(20px,3.4vh,34px); }
.hcta{
  opacity:0; display:inline-flex; align-items:center; gap:9px;
  padding:12px 22px; border-radius:999px; text-decoration:none; color:var(--paper);
  border:1px solid var(--glass-edge); background:rgba(140,170,220,.06);
  font-family:var(--f-ui); font-size:11px; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
  transition:background .45s var(--ease), border-color .45s var(--ease), box-shadow .45s var(--ease);
}
html[lang="fa"] .hcta{ font-family:var(--f-fa); font-size:13px; letter-spacing:0; text-transform:none; }
.hcta:hover{ border-color:rgba(180,215,255,.5); background:rgba(140,170,220,.13); }
.hcta--main{ border-color:rgba(227,27,35,.55); background:rgba(227,27,35,.12); }
.hcta--main:hover{ border-color:rgba(255,120,110,.8); background:rgba(227,27,35,.22); box-shadow:0 0 40px -10px rgba(227,27,35,.7); }
.hcta:focus-visible{ outline:1px solid var(--ion); outline-offset:3px; }

.hairline{
  margin-top:clamp(16px,2.8vh,30px);
  width:min(300px,46vw); height:1px;
  background:linear-gradient(to right, transparent, var(--glass-edge) 20%, rgba(227,27,35,.55) 50%, var(--glass-edge) 80%, transparent);
  transform:scaleX(0);
}

/* ---------- scroll cue ---------- */
.cue{
  height:clamp(46px,7vh,74px); display:flex; align-items:center; justify-content:center; opacity:0;
}
.cue span{
  display:block; width:1px; height:100%;
  background:linear-gradient(to bottom, transparent, rgba(227,27,35,.75), transparent);
  animation:cueFall 3.4s ease-in-out infinite;
}
@keyframes cueFall{ 0%,100%{ opacity:.15; transform:scaleY(.4); } 50%{ opacity:1; transform:scaleY(1); } }

/* ---------- navigation portals ---------- */
.portals{
  padding:clamp(46px,9vh,110px) var(--gutter) clamp(60px,12vh,140px);
}
.deck{
  display:grid; grid-template-columns:repeat(6,1fr);
  gap:clamp(14px,1.8vw,30px);
  width:100%; max-width:1240px; margin:0 auto;
  perspective:1800px; perspective-origin:50% 50%;
}
.panel{
  position:relative; isolation:isolate;
  display:flex; flex-direction:column; justify-content:flex-end;
  min-height:clamp(168px,23vh,232px);
  padding:clamp(20px,1.9vw,30px);
  border:1px solid var(--glass-edge);
  border-radius:18px;
  background:
    linear-gradient(180deg, rgba(150,190,255,.085) 0%, rgba(90,130,200,.015) 42%, rgba(0,0,0,.42) 100%);
  -webkit-backdrop-filter:blur(13px) saturate(135%);
  backdrop-filter:blur(13px) saturate(135%);
  box-shadow:
    inset 0 1px 0 rgba(215,235,255,.2),
    inset 0 -22px 44px -30px rgba(43,108,255,.42),
    0 26px 60px -32px rgba(0,0,0,1);
  color:var(--paper); text-decoration:none; overflow:hidden; cursor:pointer;
  opacity:0; transform-style:preserve-3d;
  transition:border-color .5s var(--ease), box-shadow .6s var(--ease), background .6s var(--ease);
}
/* the glass itself never moves — only the light inside it does, so each
   portal still breathes without resampling the blur under it */
.panel{ grid-column:span 2; }
.panel:nth-child(4), .panel:nth-child(5){ grid-column:span 3; }
.panel:nth-child(6){ grid-column:1 / -1; }

.panel:nth-child(1) .panel__aura{ animation-duration:29s; animation-delay:-4s; }
.panel:nth-child(2) .panel__aura{ animation-duration:36s; animation-delay:-11s; }
.panel:nth-child(3) .panel__aura{ animation-duration:31s; animation-delay:-19s; }
.panel:nth-child(4) .panel__aura{ animation-duration:41s; animation-delay:-7s; }
.panel:nth-child(5) .panel__aura{ animation-duration:33s; animation-delay:-24s; }
.panel:nth-child(6) .panel__aura{ animation-duration:39s; animation-delay:-9s; }
.panel:nth-child(6) .panel__aura{ animation-duration:38s; animation-delay:-14s; }

.panel__aura{
  position:absolute; inset:-50%; z-index:0; opacity:.5;
  background:conic-gradient(from 0deg,
    rgba(143,219,255,0) 0deg, rgba(143,219,255,.08) 60deg,
    rgba(43,108,255,.05) 150deg, rgba(227,27,35,.07) 210deg,
    rgba(143,219,255,0) 320deg);
  animation:auraTurn 34s linear infinite; pointer-events:none;
}
@keyframes auraTurn{ to{ transform:rotate(360deg); } }
.panel__sheen{
  position:absolute; inset:-40% -60%; z-index:0;
  background:linear-gradient(105deg, transparent 38%, rgba(190,225,255,.15) 48%, rgba(227,27,35,.07) 55%, transparent 63%);
  transform:translateX(-58%);
  transition:transform 1.05s var(--ease);
}
.panel__glow{
  position:absolute; left:50%; bottom:-72%; z-index:0;
  width:125%; aspect-ratio:1/1; transform:translateX(-50%);
  background:radial-gradient(circle, rgba(227,27,35,.34) 0%, rgba(43,108,255,.14) 44%, transparent 68%);
  opacity:0; transition:opacity .6s var(--ease);
}
.panel__edge{
  position:absolute; top:0; inset-inline:0; height:1px; z-index:0;
  background:linear-gradient(to right, transparent, rgba(227,27,35,.9), transparent);
  transform:scaleX(.18); opacity:.35;
  transition:transform .7s var(--ease), opacity .7s var(--ease);
}
/* the marker is the brand's own hexagon, not a generic dot */
.panel__mark{
  z-index:2;
  position:absolute; top:clamp(17px,1.7vw,26px); inset-inline-end:clamp(17px,1.7vw,26px);
  width:13px; height:15px;
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  background:var(--paper-ghost);
  transition:background .5s var(--ease), filter .5s var(--ease);
}
.panel__rule{
  position:relative; z-index:2;
  margin:0 0 auto; width:26px; height:1px;
  background:linear-gradient(to right, var(--ember), rgba(227,27,35,.15));
  transition:width .6s var(--ease);
}
.panel__title{
  position:relative; z-index:2;
  font-family:var(--f-display); font-weight:300;
  font-size:clamp(16px,1.35vw,22px); line-height:1.3; letter-spacing:-.014em;
  margin:0 0 9px; text-wrap:balance;
}
.panel__desc{
  position:relative; z-index:2;
  font-family:var(--f-ui); font-weight:300;
  font-size:clamp(11.5px,.86vw,13.5px); line-height:1.62; letter-spacing:.002em;
  color:var(--paper-dim); margin:0; max-width:36ch;
  transition:color .5s var(--ease);
}
html[lang="fa"] .panel__title{ font-family:var(--f-fa); font-weight:400; letter-spacing:0; line-height:1.45; }
html[lang="fa"] .panel__desc{ font-family:var(--f-fa); font-size:clamp(12px,.92vw,14px); line-height:1.95; }

.panel:hover,.panel:focus-visible{
  border-color:rgba(255,150,150,.34);
  background:linear-gradient(180deg, rgba(185,215,255,.13) 0%, rgba(120,60,70,.04) 42%, rgba(0,0,0,.36) 100%);
  box-shadow:
    inset 0 1px 0 rgba(230,244,255,.3),
    inset 0 -28px 54px -26px rgba(227,27,35,.5),
    0 44px 96px -36px rgba(140,18,24,.55);
  outline:none;
}
.panel:hover .panel__sheen,.panel:focus-visible .panel__sheen{ transform:translateX(58%); }
.panel:hover .panel__glow,.panel:focus-visible .panel__glow{ opacity:1; }
.panel:hover .panel__edge,.panel:focus-visible .panel__edge{ transform:scaleX(1); opacity:1; }
.panel:hover .panel__rule,.panel:focus-visible .panel__rule{ width:64px; }
.panel:hover .panel__desc,.panel:focus-visible .panel__desc{ color:rgba(237,242,250,.78); }
.panel:hover .panel__mark,.panel:focus-visible .panel__mark{
  background:var(--ember); filter:drop-shadow(0 0 12px rgba(227,27,35,.9));
}
.panel:focus-visible{ outline:1px solid var(--ion); outline-offset:3px; }


/* ---------- the channels bar: the final portal reads as a rail, not a card ---------- */
.panel--social{
  min-height:0; flex-direction:row; align-items:center; justify-content:space-between;
  gap:clamp(16px,3vw,48px);
  padding:clamp(18px,1.8vw,28px) clamp(22px,2.4vw,36px);
  border-color:rgba(227,27,35,.3);
  background:linear-gradient(100deg, rgba(227,27,35,.13) 0%, rgba(90,130,200,.03) 46%, rgba(0,0,0,.5) 100%);
}
.panel--social .panel__rule, .panel--social .panel__mark{ display:none; }
.panel--social .panel__copy{ position:relative; z-index:2; display:flex; flex-direction:column; gap:5px; min-width:0; }
.panel--social .panel__desc{ margin:0; }
.panel--social .panel__icons{
  position:relative; z-index:2; flex:none;
  display:flex; align-items:center; gap:clamp(15px,1.7vw,28px);
}
.panel--social .panel__icons i{
  width:21px; height:21px; display:block; color:var(--paper-dim);
  transition:color .45s var(--ease), transform .45s var(--ease);
}
.panel--social .panel__icons svg{ width:100%; height:100%; display:block; }
.panel--social:hover .panel__icons i{ color:var(--paper); }
.panel--social:hover .panel__icons i:first-child{ color:var(--ember-soft); }
@media (max-width:640px){
  .panel--social{ flex-direction:column; align-items:flex-start; gap:16px; }
}

/* ---------- content bands ---------- */
.band{ padding:clamp(48px,9vh,116px) var(--gutter); }
.band__head{ max-width:1240px; margin:0 auto clamp(26px,4.6vh,54px); }
.band__title{
  font-family:var(--f-display); font-weight:200;
  font-size:clamp(24px,3.1vw,44px); line-height:1.12; letter-spacing:-.022em; margin:0;
}
html[lang="fa"] .band__title{ font-family:var(--f-fa); font-weight:300; letter-spacing:0; line-height:1.4; }
.band__sub{
  margin:11px 0 0; max-width:56ch;
  font-family:var(--f-ui); font-size:clamp(12px,.92vw,14.5px); line-height:1.7; color:var(--paper-dim);
}
html[lang="fa"] .band__sub{ font-family:var(--f-fa); line-height:2; }
.band__rule{
  margin-top:clamp(18px,3vh,30px); width:100%; max-width:1240px; height:1px;
  background:linear-gradient(to right, rgba(227,27,35,.6), rgba(143,219,255,.14) 30%, transparent 72%);
}
html[dir="rtl"] .band__rule{ background:linear-gradient(to left, rgba(227,27,35,.6), rgba(143,219,255,.14) 30%, transparent 72%); }

/* ---------- glass surface, shared ---------- */
.card{
  position:relative; isolation:isolate; overflow:hidden;
  border:1px solid var(--glass-edge); border-radius:18px;
  background:linear-gradient(180deg, rgba(150,190,255,.08) 0%, rgba(90,130,200,.014) 42%, rgba(0,0,0,.44) 100%);
  -webkit-backdrop-filter:blur(20px) saturate(140%); backdrop-filter:blur(20px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(215,235,255,.18), 0 26px 60px -34px rgba(0,0,0,1);
  color:var(--paper); text-decoration:none; opacity:0;
  transition:border-color .5s var(--ease), box-shadow .6s var(--ease), transform .7s var(--ease);
}
.card:hover, .card:focus-within{
  border-color:rgba(255,150,150,.32);
  box-shadow:inset 0 1px 0 rgba(230,244,255,.28),
             inset 0 -30px 60px -30px rgba(227,27,35,.34),
             0 44px 96px -38px rgba(140,18,24,.5);
}

/* ---------- documentaries ---------- */
.films{
  display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(16px,2vw,32px); max-width:1240px; margin:0 auto;
  perspective:1500px; perspective-origin:50% 50%;
}
.film__cover{ position:relative; aspect-ratio:16/9; overflow:hidden; background:#04060c; display:block; }
.film__cover img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:saturate(.92) contrast(1.04) brightness(.92);
  transform:scale(1.015);
  transition:transform 1.4s var(--ease), filter 1s var(--ease);
}
.film:hover .film__cover img{ transform:scale(1.06); filter:saturate(1) contrast(1.05) brightness(1); }
/* once the turn is attached the cover is driven per-frame, so the long
   transform easing has to come off or every pointer reading would arrive
   1.4s late. the filter keeps its own. */
.film.is-turning .film__cover img{ transition:filter 1s var(--ease); }
.film__scrim{
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.86) 0%, rgba(0,0,0,.18) 46%, rgba(0,0,0,0) 78%),
             radial-gradient(120% 80% at 50% 110%, rgba(227,27,35,.18), transparent 60%);
}
.film__time{
  position:absolute; bottom:12px; inset-inline-end:12px;
  font-family:var(--f-ui); font-size:10.5px; letter-spacing:.1em; font-variant-numeric:tabular-nums;
  padding:4px 9px; border-radius:5px; color:var(--paper);
  background:rgba(0,0,0,.62); border:1px solid rgba(255,255,255,.14);
}
.film__play{ position:absolute; inset:0; display:grid; place-items:center; opacity:0; transition:opacity .55s var(--ease); }
.film:hover .film__play{ opacity:1; }
.film__play i{
  width:58px; height:58px; border-radius:50%;
  border:1px solid rgba(255,255,255,.38); background:rgba(0,0,0,.28);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  display:grid; place-items:center;
}
.film__play i::after{
  content:''; width:0; height:0; margin-inline-start:4px;
  border-left:13px solid var(--paper); border-top:8px solid transparent; border-bottom:8px solid transparent;
}
html[dir="rtl"] .film__play i::after{ transform:scaleX(-1); }
.film__body{ padding:clamp(18px,1.8vw,28px); }
.film__title{
  font-family:var(--f-display); font-weight:300;
  font-size:clamp(15px,1.28vw,21px); line-height:1.34; letter-spacing:-.014em; margin:0 0 10px; text-wrap:balance;
}
html[lang="fa"] .film__title{ font-family:var(--f-fa); font-weight:400; letter-spacing:0; line-height:1.55; }
.film__desc{
  font-family:var(--f-ui); font-weight:300;
  font-size:clamp(11.5px,.86vw,13.5px); line-height:1.68; color:var(--paper-dim); margin:0 0 clamp(16px,1.6vw,22px);
}
html[lang="fa"] .film__desc{ font-family:var(--f-fa); font-size:clamp(12px,.9vw,14px); line-height:1.95; }

/* ---------- depth ----------
   the cards join the nav deck's space: a shared vanishing point, a turn
   toward the cursor, and a specular that slides across the pane. the
   sprite is a fixed circle that is only ever translated, so tracking the
   cursor costs a composite and never a repaint. */
.glare{
  position:absolute; inset:0; z-index:3; overflow:hidden;
  opacity:0; pointer-events:none;
  transition:opacity .55s var(--ease);
}
.glare i{
  position:absolute; top:0; left:0; width:58%; aspect-ratio:1/1; margin:-29% 0 0 -29%;
  background:radial-gradient(circle,
    rgba(205,230,255,.17) 0%, rgba(143,219,255,.075) 38%, transparent 68%);
}
.card:hover .glare, .card:focus-within .glare{ opacity:1; }

/* the play mark arrives with the turn rather than just fading up */
.film__play i{ transform:scale(.84); transition:transform .55s var(--ease); }
.film:hover .film__play i, .film:focus-within .film__play i{ transform:scale(1); }

.collection{ max-width:1240px; margin:0 auto; }
.collection__head{
  display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
  margin-bottom:clamp(16px,2.4vh,26px);
}
.collection__head h3{
  margin:0; font-family:var(--f-display); font-weight:300;
  font-size:clamp(16px,1.5vw,23px); letter-spacing:-.014em;
}
html[lang="fa"] .collection__head h3{ font-family:var(--f-fa); font-weight:400; letter-spacing:0; }

/* ---------- call to action ---------- */
.cta{
  display:inline-flex; align-items:center; gap:9px;
  padding:9px 16px; border-radius:999px;
  border:1px solid rgba(227,27,35,.42); background:rgba(227,27,35,.07);
  color:var(--paper); text-decoration:none;
  font-family:var(--f-ui); font-size:10.5px; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
  transition:background .45s var(--ease), border-color .45s var(--ease), box-shadow .45s var(--ease);
}
html[lang="fa"] .cta{ font-family:var(--f-fa); font-size:12px; letter-spacing:.02em; text-transform:none; }
.cta::after{
  content:''; width:14px; height:1px; background:currentColor; opacity:.55;
  transition:width .45s var(--ease);
}
.cta:hover{ background:rgba(227,27,35,.2); border-color:rgba(255,120,110,.75); box-shadow:0 0 30px -6px rgba(227,27,35,.5); }
.cta:hover::after{ width:26px; }
.cta:focus-visible{ outline:1px solid var(--ion); outline-offset:3px; }
html[dir="rtl"] .cta::after{ transform:scaleX(-1); }

/* ---------- social ---------- */
.socials{
  display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(14px,1.7vw,26px); max-width:1240px; margin:0 auto;
  perspective:1500px; perspective-origin:50% 50%;
}
.social{ display:flex; flex-direction:column; padding:clamp(20px,1.9vw,30px); }
.social__icon{ width:30px; height:30px; color:var(--paper); opacity:.9; margin-bottom:clamp(16px,1.8vh,26px); }
.social__icon svg{ width:100%; height:100%; display:block; }
.social:hover .social__icon{ color:var(--ember-soft); }
.social__icon{ transition:color .5s var(--ease); }
.social__name{
  font-family:var(--f-display); font-weight:300; font-size:clamp(15px,1.15vw,19px);
  letter-spacing:-.01em; margin:0 0 4px;
}
.social__handle{
  font-family:var(--f-ui); font-size:10.5px; letter-spacing:.14em; text-transform:lowercase;
  color:rgba(227,27,35,.9); margin:0 0 12px;
}
.social__desc{
  font-family:var(--f-ui); font-weight:300; font-size:clamp(11.5px,.84vw,13px); line-height:1.66;
  color:var(--paper-dim); margin:0 0 clamp(16px,1.8vw,24px);
}
html[lang="fa"] .social__name{ font-family:var(--f-fa); font-weight:400; }
html[lang="fa"] .social__desc{ font-family:var(--f-fa); font-size:clamp(12px,.9vw,13.5px); line-height:1.95; }
.social .cta{ margin-top:auto; align-self:flex-start; }

@media (max-width:1100px){
  .socials{ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:760px){
  .films{ grid-template-columns:1fr; }
}
@media (max-width:520px){
  .socials{ grid-template-columns:1fr; }
}


/* ---------- portal view: a panel opens into its own screen ---------- */
.view{ position:fixed; inset:0; z-index:20; display:flex; }
.view[hidden]{ display:none; }
.view__scrim{
  position:absolute; inset:0; background:rgba(0,0,0,.7);
  -webkit-backdrop-filter:blur(11px) saturate(120%); backdrop-filter:blur(11px) saturate(120%);
}
.view__panel{
  position:relative; margin:auto; width:min(1340px,100%); height:100%;
  display:flex; flex-direction:column;
}
.view__scroll{
  height:100%; overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:clamp(58px,9vh,104px) 0 clamp(44px,8vh,96px);
}
.view__scroll::-webkit-scrollbar{ width:2px; }
.view__scroll::-webkit-scrollbar-thumb{ background:rgba(227,27,35,.5); }
.view__close{
  position:absolute; top:clamp(14px,2.2vh,26px); inset-inline-end:clamp(16px,3.6vw,44px); z-index:3;
  width:44px; height:44px; border-radius:50%; cursor:pointer; padding:0;
  border:1px solid var(--glass-edge); background:rgba(0,0,0,.42);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  display:grid; place-items:center;
  transition:border-color .45s var(--ease), background .45s var(--ease), transform .5s var(--ease);
}
.view__close::before,.view__close::after{
  content:''; position:absolute; width:15px; height:1px; background:var(--paper);
}
.view__close::before{ transform:rotate(45deg); }
.view__close::after{ transform:rotate(-45deg); }
.view__close:hover{ border-color:rgba(255,120,110,.75); background:rgba(227,27,35,.2); transform:rotate(90deg); }
.view__close:focus-visible{ outline:1px solid var(--ion); outline-offset:3px; }
.band[hidden]{ display:none; }
body.view-open{ overflow:hidden; }

/* portals with nothing behind them yet read as dormant, not broken */
.panel--soon{ cursor:default; }
.panel--soon .panel__mark{ opacity:.35; }
.panel--soon:hover .panel__mark{ background:var(--paper-ghost); filter:none; }




/* ---------- empty state: an invitation, not an apology ---------- */
.empty{
  max-width:1240px; margin:0 auto; padding:clamp(40px,8vh,96px) 0;
  display:flex; flex-direction:column; align-items:center; text-align:center;
}
.empty__glyph{
  width:52px; height:59px; color:rgba(227,27,35,.55); margin-bottom:clamp(22px,3.4vh,36px);
  animation:glyphPulse 6s ease-in-out infinite;
}
@keyframes glyphPulse{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
.empty__text{
  margin:0 0 clamp(24px,3.6vh,38px); max-width:44ch;
  font-family:var(--f-ui); font-weight:300;
  font-size:clamp(13px,1.05vw,16px); line-height:1.8; color:var(--paper-dim);
}
html[lang="fa"] .empty__text{ font-family:var(--f-fa); line-height:2.1; }

/* ---------- future section mount ---------- */
#sections:empty{ display:none; }
#sections > .section{ padding:clamp(80px,14vh,180px) 0; }

/* ---------- boot curtain ---------- */
#curtain{ position:fixed; inset:0; z-index:50; background:#000; display:flex; align-items:center; justify-content:center; }
#curtain .bar{ width:min(180px,38vw); height:1px; background:rgba(237,242,250,.10); overflow:hidden; }
#curtain .bar i{ display:block; height:100%; width:0%; background:linear-gradient(to right, transparent, var(--ember)); }

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .deck{ grid-template-columns:repeat(2,1fr); }
  .panel, .panel:nth-child(4), .panel:nth-child(5){ grid-column:span 1; }
  .panel:nth-child(6){ grid-column:1 / -1; }
}
/* phones: backdrop blur over a live canvas and a full-screen grain layer are
   the two things that actually cost frames. Both are dropped, and the panels
   get a solid translucent fill that reads almost identically. */
@media (max-width:900px){
  .panel, .card{
    -webkit-backdrop-filter:none; backdrop-filter:none;
    background:linear-gradient(180deg, rgba(96,132,196,.16) 0%, rgba(16,24,42,.5) 42%, rgba(3,5,11,.68) 100%);
  }
  .panel--social{ background:linear-gradient(100deg, rgba(140,30,38,.26) 0%, rgba(16,22,38,.52) 50%, rgba(3,5,11,.7) 100%); }
  .panel__aura{ display:none; }
  .grade--grain{ display:none; }
  .view__scrim{ -webkit-backdrop-filter:none; backdrop-filter:none; background:rgba(0,0,0,.9); }
}
@media (max-width:640px){
  .deck{ grid-template-columns:1fr; perspective:none; gap:12px; }
  .panel{ min-height:0; border-radius:15px; padding:18px; }
  .panel__desc{ max-width:none; }
}
@media (max-width:520px){
  .tagline{ font-size:9px; letter-spacing:.24em; }
  html[lang="fa"] .tagline{ font-size:11px; }
  .pitch{ font-size:14.5px; }
  .hcta{ padding:11px 18px; }
  .panel__title{ font-size:16px; }
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.001ms !important; transition-duration:.12s !important; }
}

</style>

<script>
/* =====================================================================
   NAVIDIX CORE
   ===================================================================== */
const NAVIDIX = (() => {

/* =====================================================================
   STAGE
   ===================================================================== */
const Stage = (() => {
  const { config, state } = NAVIDIX;
  let renderer, scene, camera, dpr;

  function init(){
    const small = Math.min(innerWidth, innerHeight) < 700;
    const cores = navigator.hardwareConcurrency || 4;
    if (small || cores <= 4) config.quality = { stars:2200, dust:0, dpr:1.25, nebulae:1, streaks:1, octaves:3 };
    if (state.reduced) { config.quality.dust = 0; config.quality.streaks = 0; }

    scene  = new THREE.Scene();
    scene.background = new THREE.Color(config.color.void);
    camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 1, 4200);
    camera.position.set(0, 0, state.reduced ? config.camZ : 1500);

    dpr = Math.min(devicePixelRatio || 1, config.quality.dpr);
    renderer = new THREE.WebGLRenderer({ antialias:false, alpha:false, powerPreference:'high-performance' });
    renderer.setPixelRatio(dpr);
    renderer.setSize(innerWidth, innerHeight);
    document.getElementById('stage').appendChild(renderer.domElement);

    state.clock = new THREE.Clock();
    addEventListener('resize', onResize, { passive:true });
    addEventListener('orientationchange', () => setTimeout(onResize, 250));
    document.addEventListener('visibilitychange', () => { state.running = !document.hidden; });
    return { scene, camera };
  }

  function onResize(){
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    NAVIDIX.each(m => m.layout && m.layout());
  }

  /* viewport size in world units at the plane the mark sits on */
  function viewport(z){
    const dist = config.camZ - z;
    const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * dist;
    return { h, w: h * camera.aspect };
  }

  let samples = [], degraded = false;
  function watch(dt){
    if (degraded) return;
    samples.push(dt);
    if (samples.length < 90) return;
    const avg = samples.reduce((a,b)=>a+b,0) / samples.length;
    samples = [];
    if (avg > 0.0235){ degraded = true; renderer.setPixelRatio(Math.max(1, dpr*0.7)); }
  }

  return { init, viewport, watch,
    render(){ renderer.render(scene, camera); },
    get scene(){return scene;}, get camera(){return camera;}, get renderer(){return renderer;} };
})();

/* =====================================================================
   STARFIELD — sparse, but every bright star is a real object:
   core + halo + four-point diffraction spikes, JWST-style.
   ===================================================================== */
function buildStarfield(scene){
  const { config } = NAVIDIX;
  const N = config.quality.stars;
  const pos = new Float32Array(N*3), col = new Float32Array(N*3);
  const siz = new Float32Array(N), twk = new Float32Array(N), spk = new Float32Array(N);

  const cIon = new THREE.Color(config.color.ion),
        cBlue= new THREE.Color(config.color.glow),
        cWarm= new THREE.Color(0xfff1e2),
        cRed = new THREE.Color(config.color.ember);
  const tmp = new THREE.Color();

  for (let i=0;i<N;i++){
    const r = 320 + Math.pow(Math.random(), .5) * 1850;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.sin(ph)*Math.sin(th)*0.7;
    pos[i*3+2] = r*Math.cos(ph);

    const t = Math.random();
    if (t > .978)      tmp.copy(cRed).lerp(cWarm,.25);   // rare red giants
    else if (t > .90)  tmp.copy(cWarm);
    else if (t > .52)  tmp.copy(cIon);
    else               tmp.copy(cBlue).lerp(cIon, Math.random());
    col[i*3]=tmp.r; col[i*3+1]=tmp.g; col[i*3+2]=tmp.b;

    const bright = Math.pow(Math.random(), 9);           // very few anchors
    siz[i] = 0.5 + bright*10.0;
    spk[i] = bright > .34 ? Math.min(1, (bright-.34)*2.6) : 0.0;
    twk[i] = .12 + Math.random()*.85;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(siz,1));
  geo.setAttribute('aTwinkle', new THREE.BufferAttribute(twk,1));
  geo.setAttribute('aSpike',   new THREE.BufferAttribute(spk,1));

  const mat = new THREE.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uDpr:{value:Math.min(devicePixelRatio||1,2)}, uOpacity:{value:0} },
    vertexShader:`
      attribute float aSize; attribute float aTwinkle; attribute float aSpike; attribute vec3 aColor;
      uniform float uTime, uDpr;
      varying vec3 vColor; varying float vFade; varying float vSpike;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        float d = -mv.z;
        float tw = 0.6 + 0.4*sin(uTime*aTwinkle + aTwinkle*37.0);
        gl_PointSize = aSize * uDpr * (340.0/max(d,40.0)) * tw * (1.0 + aSpike*2.4);
        gl_Position = projectionMatrix * mv;
        vColor = aColor;
        vFade  = smoothstep(2300.0, 520.0, d) * tw;
        vSpike = aSpike;
      }`,
    fragmentShader:`
      precision mediump float;
      uniform float uOpacity;
      varying vec3 vColor; varying float vFade; varying float vSpike;
      void main(){
        vec2 p = gl_PointCoord - 0.5;
        float r = length(p) * 2.0;
        if (r > 1.0) discard;
        float k = 1.0 - r;
        float core = pow(k, 7.0);
        float halo = pow(k, 2.0) * 0.16;
        vec2 d = abs(p) * 2.0;
        float sx = pow(max(0.0, 1.0-d.x*9.0), 1.5) * pow(max(0.0,1.0-d.y), 3.0);
        float sy = pow(max(0.0, 1.0-d.y*9.0), 1.5) * pow(max(0.0,1.0-d.x), 3.0);
        float spike = (sx+sy) * vSpike * 0.55;
        float a = (core + halo + spike) * vFade * uOpacity;
        gl_FragColor = vec4(vColor * (core*2.0 + halo + spike*1.4), a);
      }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  });

  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return NAVIDIX.register('starfield', {
    material:mat,
    update(t){ mat.uniforms.uTime.value = t; pts.rotation.y = t*0.0055; }
  });
}

/* =====================================================================
   NEBULAE — sparse volume, fine filaments, near-black falloff
   ===================================================================== */
const NEB_FRAG = `
precision highp float;
uniform float uTime, uOpacity, uSeed, uEmber;
uniform vec3 uColA, uColB, uColC;
varying vec2 vUv;
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y);
}
float fbm(vec2 p){ float v=0.0,a=0.5; for(int i=0;i<OCT;i++){ v+=a*noise(p); p=p*2.03+17.3; a*=0.5; } return v; }
void main(){
  vec2 uv = vUv;
  vec2 q  = uv*3.2 + uSeed;
  float dr = uTime*0.011;
  float f1 = fbm(q + vec2(dr,-dr*0.6));
  float f2 = fbm(q*2.1 + vec2(f1*1.5, dr*0.8));
  float fil= fbm(q*7.0 - vec2(dr*0.3, f1));           // fine filaments
  float density = pow(smoothstep(0.42, 0.95, f1*0.6 + f2*0.4), 2.4);
  density *= 0.62 + 0.38*fil;                          // detail, not fog
  vec2 c = (uv-0.5) * vec2(1.0,1.28);
  float mask = smoothstep(0.5, 0.05, length(c));
  vec3 col = mix(uColA, uColB, f2);
  col = mix(col, uColC, pow(fil, 2.6)*uEmber);
  col += uColB * pow(density, 3.2) * 0.5;
  gl_FragColor = vec4(col, density*mask*uOpacity);
}`;
const NEB_VERT = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;

function buildNebulae(scene){
  const { config } = NAVIDIX;
  const specs = [
    { z:-1300, s:3600, rot: .22, seed: 1.7, a:0x030814, b:0x2b6cff, ember:.30, o:.30 },
    { z:-850,  s:2500, rot:-.44, seed: 8.3, a:0x05101f, b:0x1b4fd0, ember:.12, o:.20 },
    { z:-460,  s:1550, rot: .85, seed:14.9, a:0x120309, b:0x3a7bff, ember:.85, o:.13 }
  ].slice(0, config.quality.nebulae);

  const layers = specs.map(sp => {
    const mat = new THREE.ShaderMaterial({
      uniforms:{ uTime:{value:0}, uOpacity:{value:0}, uSeed:{value:sp.seed}, uEmber:{value:sp.ember},
        uColA:{value:new THREE.Color(sp.a)}, uColB:{value:new THREE.Color(sp.b)}, uColC:{value:new THREE.Color(config.color.ember)} },
      vertexShader:NEB_VERT,
      fragmentShader:'#define OCT ' + (config.quality.octaves || 5) + '\n' + NEB_FRAG,
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(sp.s, sp.s), mat);
    mesh.position.z = sp.z; mesh.rotation.z = sp.rot;
    scene.add(mesh);
    return { mat, mesh, rot:sp.rot, target:sp.o };
  });

  return NAVIDIX.register('nebulae', {
    layers,
    update(t){ layers.forEach((l,i)=>{ l.mat.uniforms.uTime.value=t; l.mesh.rotation.z = l.rot + Math.sin(t*0.02+i)*0.012; }); }
  });
}

/* =====================================================================
   DUST
   ===================================================================== */
function buildDust(scene){
  const N = NAVIDIX.config.quality.dust;
  if (!N) return NAVIDIX.register('dust', { material:{uniforms:{uOpacity:{value:0}}}, update(){} });
  const pos = new Float32Array(N*3), spd = new Float32Array(N);
  for (let i=0;i<N;i++){
    pos[i*3]=(Math.random()-.5)*1600; pos[i*3+1]=(Math.random()-.5)*1000; pos[i*3+2]=140+Math.random()*520;
    spd[i]=.4+Math.random();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSpeed',   new THREE.BufferAttribute(spd,1));
  const mat = new THREE.ShaderMaterial({
    uniforms:{ uTime:{value:0}, uOpacity:{value:0}, uDpr:{value:Math.min(devicePixelRatio||1,2)} },
    vertexShader:`
      attribute float aSpeed; uniform float uTime,uDpr; varying float vA;
      void main(){
        vec3 p = position;
        p.y += sin(uTime*0.07*aSpeed + p.x*0.004)*26.0;
        p.x += cos(uTime*0.05*aSpeed + p.y*0.003)*20.0;
        vec4 mv = modelViewMatrix*vec4(p,1.0);
        gl_PointSize = (1.2+aSpeed)*uDpr*(300.0/max(-mv.z,60.0));
        gl_Position = projectionMatrix*mv;
        vA = smoothstep(940.0,180.0,-mv.z);
      }`,
    fragmentShader:`
      precision mediump float; uniform float uOpacity; varying float vA;
      void main(){ float r=length(gl_PointCoord-0.5)*2.0; if(r>1.0) discard;
        gl_FragColor=vec4(vec3(0.58,0.76,1.0), pow(1.0-r,3.0)*vA*uOpacity*0.42); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
  });
  scene.add(new THREE.Points(geo, mat));
  return NAVIDIX.register('dust', { material:mat, update(t){ mat.uniforms.uTime.value = t; } });
}

/* =====================================================================
   STREAKS — a meteor crosses the field every twenty seconds or so.
   Rare on purpose: the reward for staying.
   ===================================================================== */
function streakTexture(){
  const c = document.createElement('canvas'); c.width=512; c.height=64;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0,0,512,0);
  grd.addColorStop(0,'rgba(143,219,255,0)');
  grd.addColorStop(.72,'rgba(143,219,255,0.30)');
  grd.addColorStop(.94,'rgba(255,255,255,0.95)');
  grd.addColorStop(1,'rgba(255,120,100,0)');
  g.fillStyle = grd;
  for (let y=0;y<64;y++){
    g.globalAlpha = Math.pow(1 - Math.abs(y-32)/32, 3);
    g.fillRect(0,y,512,1);
  }
  return new THREE.CanvasTexture(c);
}
function buildStreaks(scene){
  const N = NAVIDIX.config.quality.streaks;
  if (!N) return NAVIDIX.register('streaks', { update(){} });
  const tex = streakTexture();
  const items = [];
  for (let i=0;i<N;i++){
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0 }));
    spr.scale.set(340, 42, 1);
    scene.add(spr);
    items.push({ spr, next: 4 + Math.random()*14, life:-1, from:new THREE.Vector3(), dir:new THREE.Vector3() });
  }
  return NAVIDIX.register('streaks', {
    update(t, dt){
      items.forEach(it => {
        if (it.life < 0){
          it.next -= dt;
          if (it.next > 0) return;
          const ang = (-0.5 + Math.random()*0.35);
          it.dir.set(Math.cos(ang), Math.sin(ang), 0);
          it.from.set(-700 + Math.random()*300, 180 + Math.random()*260, -180 + Math.random()*260);
          it.spr.material.rotation = ang;
          it.life = 0;
        }
        it.life += dt;
        const p = it.life / 1.15;
        if (p >= 1){ it.life = -1; it.next = 9 + Math.random()*16; it.spr.material.opacity = 0; return; }
        const e = 1 - Math.pow(1-p, 2);
        it.spr.position.copy(it.from).addScaledVector(it.dir, e*1500);
        it.spr.material.opacity = Math.sin(p*Math.PI) * 0.85;
      });
    }
  });
}

/* =====================================================================
   MARK — the suspended hexagon. Sized from the viewport every resize,
   so it reads the same on a phone as on a 32" display.
   ===================================================================== */
function radialSprite(color, size, opacity, blending){
  const c = document.createElement('canvas'); c.width=c.height=256;
  const g = c.getContext('2d');
  const col = new THREE.Color(color);
  const rgb = `${(col.r*255)|0},${(col.g*255)|0},${(col.b*255)|0}`;
  const grd = g.createRadialGradient(128,128,0,128,128,128);
  grd.addColorStop(0,`rgba(${rgb},0.95)`); grd.addColorStop(.24,`rgba(${rgb},0.42)`);
  grd.addColorStop(.56,`rgba(${rgb},0.10)`); grd.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false,
    blending: blending || THREE.AdditiveBlending, opacity
  }));
  spr.scale.set(size,size,1);
  return spr;
}

function ringTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128,128,0,128,128,128);
  grd.addColorStop(0,   'rgba(227,27,35,0)');
  grd.addColorStop(.74, 'rgba(227,27,35,0)');
  grd.addColorStop(.87, 'rgba(255,90,80,0.85)');
  grd.addColorStop(.94, 'rgba(143,219,255,0.35)');
  grd.addColorStop(1,   'rgba(227,27,35,0)');
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

function buildMark(scene){
  const { config, state } = NAVIDIX;
  const group = new THREE.Group();
  group.position.set(0, 0, 60);
  scene.add(group);
  const core = new THREE.Group(); group.add(core);

  group.add(new THREE.AmbientLight(config.color.deep, 1.8));
  const key = new THREE.PointLight(0xcfeaff, 2.6, 1000, 2); key.position.set(-160,130,240);
  const rim = new THREE.PointLight(config.color.ember, 3.0, 850, 2); rim.position.set(190,-70,-170);
  group.add(key, rim);

  /* legibility: a soft black well behind the mark so it never fights the stars */
  const well = radialSprite(0x000000, 700, 0, THREE.NormalBlending);
  well.position.z = -60; well.renderOrder = -2; group.add(well);
  const bloom      = radialSprite(config.color.glow, 760, 0); bloom.position.z=-30; bloom.renderOrder=-1; group.add(bloom);
  const bloomInner = radialSprite(config.color.ember, 270, 0); bloomInner.position.z=-14; bloomInner.renderOrder=-1; group.add(bloomInner);

  /* every eleven seconds the mark sends one ring outward — the only
     event on the page, so it registers instead of becoming wallpaper */
  const pulse = new THREE.Sprite(new THREE.SpriteMaterial({
    map:ringTexture(), transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending, opacity:0
  }));
  pulse.position.z = -20; pulse.renderOrder = -1; group.add(pulse);

  const H = 150;                       // intrinsic height at scale 1
  const api = { group, core, bloom, bloomInner, well, W:H, H, fades:[] };

  function fit(){
    const vp = Stage.viewport(group.position.z);
    const portrait = innerWidth < 900;
    let s = (vp.h * (portrait ? 0.21 : 0.27)) / api.H;
    const maxW = vp.w * (portrait ? 0.68 : 0.30);
    if (api.W * s > maxW) s = maxW / api.W;
    group.scale.setScalar(s);
    api.baseY = vp.h * 0.215;
    group.position.y = api.baseY;

    /* hand the mark's screen-space bottom edge to the layout */
    const bottom = new THREE.Vector3(0, api.baseY - (api.H*s)/2, group.position.z).project(Stage.camera);
    const px = (1 - (bottom.y*0.5 + 0.5)) * innerHeight;
    document.documentElement.style.setProperty('--logo-bottom', Math.max(0, px) + 'px');
    api.scale = s;
  }
  api.fit = fit;

  function placeholder(){
    const m1 = new THREE.MeshStandardMaterial({ color:0x120306, emissive:new THREE.Color(config.color.ember),
      emissiveIntensity:1.0, metalness:.9, roughness:.24, transparent:true, opacity:0 });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(H*0.5, 2.4, 18, 6), m1);
    ring.rotation.z = Math.PI/2;
    core.add(ring);
    api.fades = [{ m:m1, o:1 }];
  }

  function plaque(tex){
    const img = tex.image;
    const ratio = (img && img.width && img.height) ? img.width/img.height : 1;
    const W = H * ratio;
    api.W = W;

    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.anisotropy = Stage.renderer.capabilities.getMaxAnisotropy();
    tex.needsUpdate = true;

    /* a real hexagonal prism: the mark has thickness, so the 360° turn
       shows machined metal instead of collapsing into nothing */
    const bodyMat = new THREE.MeshStandardMaterial({
      color:0x07090f, metalness:1.0, roughness:.3,
      emissive:new THREE.Color(0x2a0509), emissiveIntensity:1.0,
      transparent:true, opacity:0
    });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(H*.362, H*.362, 5.0, 6), bodyMat);
    body.rotation.x = Math.PI/2; body.rotation.y = Math.PI/2;

    const faceMat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, opacity:0, toneMapped:false });
    const backMat = faceMat.clone();
    const front = new THREE.Mesh(new THREE.PlaneGeometry(W,H), faceMat); front.position.z =  3.0;
    const back  = new THREE.Mesh(new THREE.PlaneGeometry(W,H), backMat); back.position.z  = -3.0; back.rotation.y = Math.PI;

    core.add(body, front, back);
    api.fades = [{ m:bodyMat, o:1 }, { m:faceMat, o:1 }, { m:backMat, o:.92 }];
    fit();
  }

  const src = config.assets.logo;
  if (src && src.indexOf('__') !== 0){
    new THREE.TextureLoader().load(src,
      t => { plaque(t); api.ready && api.ready(); },
      undefined,
      () => { placeholder(); fit(); api.ready && api.ready(); });
  } else { placeholder(); fit(); queueMicrotask(()=> api.ready && api.ready()); }

  NAVIDIX.register('mark', Object.assign(api, {
    layout: fit,
    update(t){
      /* a suspended object sways; it does not spin. two incommensurate
         periods, so the motion never repeats visibly. */
      if (!state.reduced){
        core.rotation.y = Math.sin(t*0.23) * 0.21;
        core.rotation.x = Math.sin(t*0.161 + 1.3) * 0.075;
        core.rotation.z = Math.sin(t*0.094 + 2.7) * 0.028;
      }
      group.position.y = (api.baseY || 0) + Math.sin(t*0.32) * (api.H * (api.scale||1) * 0.035);
      group.rotation.x = THREE.MathUtils.lerp(group.rotation.x, -state.pointer.y*0.09, .03);
      group.rotation.z = THREE.MathUtils.lerp(group.rotation.z,  state.pointer.x*0.04, .03);

      /* the key light travels a wide arc so the metal edge keeps catching
         a highlight — that sweep is what now reads as three-dimensional */
      key.position.x = Math.cos(t*0.22) * 300;
      key.position.y = 120 + Math.sin(t*0.15) * 90;
      key.position.z = 200 + Math.sin(t*0.22) * 160;

      bloom.material.opacity = (api.bloomBase||0) * (0.86 + 0.14*Math.sin(t*0.6));

      const cyc = (t % 11.0) / 2.8;
      if (cyc <= 1 && api.bloomBase){
        const e = 1 - Math.pow(1-cyc, 3);
        const sz = api.H * (api.scale||1) * (1.05 + e*2.6);
        pulse.scale.set(sz, sz, 1);
        pulse.material.opacity = Math.sin(cyc*Math.PI) * 0.38;
      } else pulse.material.opacity = 0;
    }
  }));
  return api;
}

/* reveal on entry — same rhythm as the portals */
function revealOnScroll(nodes, step){
  if (!('IntersectionObserver' in window)) { gsap.set(nodes, { opacity:1 }); return; }
  const io = new IntersectionObserver(es => {
    es.forEach(en => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      gsap.fromTo(en.target, { opacity:0, y:46, filter:'blur(12px)' },
        { opacity:1, y:0, filter:'blur(0px)', duration:1.3, ease:'power3.out',
          delay:(nodes.indexOf(en.target) % (step||2)) * .1, clearProps:'filter,transform' });
    });
  }, { threshold:.15, rootMargin:'0px 0px -6% 0px' });
  nodes.forEach(n => io.observe(n));
}

/* =====================================================================
   POINTER DEPTH
   The nav portals already turn toward the cursor. This puts the cards in
   the same space, from one attach, so the films, the curated set and the
   channels all read as panes of a single sheet of glass.

   Three rules keep it honest on a slow machine:
     · the box is measured once on enter, while the card is at rest.
       Measuring mid-turn would feed the card's own movement back into the
       next reading — the loop that reads as a shake.
     · every pointer reading collapses into one write per frame.
     · only transform is ever written, and will-change is held just for
       the hover, so a card is promoted to its own layer while it moves
       and handed back afterwards.

   Coarse pointers and reduced-motion never reach any of it — phones keep
   the flat card and pay nothing for this.
   ===================================================================== */
function attachTilt(cards, opt){
  if (typeof gsap === 'undefined') return;
  if (NAVIDIX.state.reduced || !matchMedia('(hover:hover)').matches) return;

  const turn = (opt && opt.turn) || 7;
  const lift = (opt && opt.lift) || 6;

  cards.forEach(card => {
    const spark = card.querySelector('.glare i');
    const body  = card.querySelector('.film__body');
    const cover = card.querySelector('.film__cover img');
    const to    = (el, p, d) => gsap.quickTo(el, p, { duration:d, ease:'power3.out' });
    if (cover) card.classList.add('is-turning');

    /* quickTo resolves the property by its exact name, and GSAP registers
       the rotations as rotationX/rotationY. The rotateX/rotateY spelling is
       an alias gsap.to() understands but quickTo silently drops. */
    const set = {
      rY: to(card, 'rotationY', .55),
      rX: to(card, 'rotationX', .55),
      y:  to(card, 'y',         .55),
      gx: spark && to(spark, 'x', .5),
      gy: spark && to(spark, 'y', .5),
      bx: body  && to(body,  'x', .6),
      by: body  && to(body,  'y', .6),
      ix: cover && to(cover, 'x', .7),
      iy: cover && to(cover, 'y', .7)
    };

    let box = null, queued = false, mx = 0, my = 0;

    const apply = () => {
      queued = false;
      if (!box) return;
      const dx = (mx - box.left) / box.width  - .5;
      const dy = (my - box.top)  / box.height - .5;

      set.rY(dx * turn);
      set.rX(-dy * turn * .78);
      set.y(-lift + dy * 3);

      if (spark){ set.gx(mx - box.left); set.gy(my - box.top); }
      /* three planes at three depths, and the gap between them is the whole
         illusion: the still leans into the cursor, the text leans away. the
         cover is held at 1.06 so there is overscan to slide inside without
         ever exposing an edge. */
      if (cover){ set.ix(dx * 13); set.iy(dy * 9); }
      if (body){ set.bx(dx * -7); set.by(dy * -4); }
    };

    const read = e => {
      mx = e.clientX; my = e.clientY;
      if (!queued){ queued = true; requestAnimationFrame(apply); }
    };

    card.addEventListener('pointerenter', e => {
      box = card.getBoundingClientRect();        // measured while at rest
      card.style.willChange = 'transform';
      if (cover) gsap.to(cover, { scale:1.06, duration:.9, ease:'power3.out' });
      read(e);
    });
    card.addEventListener('pointermove', read);

    /* the reset only ever names the properties it is putting back, and never
       takes overwrite:'auto' — that would kill the quickTo tweens outright
       and the card would come to rest for good after its first hover. */
    card.addEventListener('pointerleave', () => {
      box = null;
      card.style.willChange = '';
      set.rY(0); set.rX(0); set.y(0);
      if (body){ set.bx(0); set.by(0); }   // the specular is left where it is
                                           // and simply fades, so re-entering
                                           // never snaps it across the pane
      if (cover){
        set.ix(0); set.iy(0);
        gsap.to(cover, { scale:1.015, duration:1.1, ease:'power3.out' });
      }
    });
  });
}

    films.appendChild(el);
  }); revealOnScroll([...films.children], 2);
     attachTilt([...films.children]); }        // the grid is rebuilt when the
                                               // channel feed lands, so the

  /* the curated set uses the same card as the documentaries */

    coll.appendChild(el);
  });
  revealOnScroll([...coll.children], 2);

  const socials = document.getElementById('socialGrid');

function buildDeck(){
  const deck = document.getElementById('deck');
  const frag = document.createDocumentFragment();
  NAVIDIX.config.nav.forEach(item => {
    const a = document.createElement('a');
    const EXTERNAL = { system:'system.html', training:'training.html' };
    a.className = 'panel';
    a.href = EXTERNAL[item.id] || ('#' + item.id);
    a.dataset.section = item.id;
    if (EXTERNAL[item.id]) a.dataset.external = '1';
    a.innerHTML =
      '<span class="panel__aura"></span><span class="panel__sheen"></span><span class="panel__glow"></span>' +
      '<span class="panel__edge"></span><span class="panel__mark"></span>' +
      '<span class="panel__rule"></span>' +
      (item.id === 'social'
        ? '<span class="panel__copy"><h2 class="panel__title"></h2><p class="panel__desc"></p></span>' +
          '<span class="panel__icons">' +
            ['youtube','instagram','linkedin','telegram'].map(k => '<i>' + ICONS[k] + '</i>').join('') +
          '</span>'
        : '<h2 class="panel__title"></h2><p class="panel__desc"></p>');
    if (item.id === 'social') a.classList.add('panel--social');
    frag.appendChild(a);
  });
  deck.appendChild(frag);

  const panels = [...deck.querySelectorAll('.panel')];

  panels.forEach(a => {
    const id = a.dataset.section;
    if (a.dataset.external) return;                    // a real page — let the browser navigate
    if (!Views.has(id)) { a.classList.add('panel--soon'); a.setAttribute('aria-disabled','true'); }
    a.addEventListener('click', e => { e.preventDefault(); Views.open(id, a); });
  });

  /* Magnetic hover.
     The rect is measured once on entry and cached. Measuring it live is the
     classic trap: the panel moves toward the cursor, which changes the
     cursor's position *inside* the panel, which moves it again — a feedback
     loop that reads as a fast shake. Pointer readings are also collapsed
     into one write per animation frame. */
  if (!NAVIDIX.state.reduced && matchMedia('(hover:hover)').matches){
    panels.forEach(p => {
      /* rotationX/rotationY, not rotateX/rotateY: quickTo looks the property
         up by its exact registered name, so the alias resolves to nothing and
         the portal would translate without ever turning. */
      const set = {
        x:  gsap.quickTo(p, 'x',         { duration:.55, ease:'power3.out' }),
        y:  gsap.quickTo(p, 'y',         { duration:.55, ease:'power3.out' }),
        rY: gsap.quickTo(p, 'rotationY', { duration:.55, ease:'power3.out' }),
        rX: gsap.quickTo(p, 'rotationX', { duration:.55, ease:'power3.out' })
      };
      let box = null, queued = false, mx = 0, my = 0;

      const apply = () => {
        queued = false;
        if (!box) return;
        const dx = (mx - box.left) / box.width  - .5;
        const dy = (my - box.top)  / box.height - .5;
        set.x(dx * 10);
        set.y(-10 + dy * 7);
        set.rY(dx * 8);
        set.rX(-dy * 6);
      };

      p.addEventListener('pointerenter', e => {
        box = p.getBoundingClientRect();          // measured while at rest
        mx = e.clientX; my = e.clientY;
        if (!queued){ queued = true; requestAnimationFrame(apply); }
      });
      p.addEventListener('pointermove', e => {
        mx = e.clientX; my = e.clientY;
        if (!queued){ queued = true; requestAnimationFrame(apply); }
      });
      /* driven back through the same quickTo functions. A separate tween with
         overwrite:'auto' would kill them on the way out, and the portal would
         hold still from its second hover onward. */
      p.addEventListener('pointerleave', () => {
        box = null;
        set.x(0); set.y(0); set.rY(0); set.rX(0);
      });
    });
  }

  /* portals arrive as they enter view, not all at once on load */
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (!en.isIntersecting) return;
        io.unobserve(en.target);
        gsap.fromTo(en.target, { opacity:0, y:54, filter:'blur(14px)' },
          { opacity:1, y:0, filter:'blur(0px)', duration:1.4, ease:'power3.out',
            delay:(panels.indexOf(en.target) % 3) * .09, clearProps:'filter,transform' });
      });
    }, { threshold:.18, rootMargin:'0px 0px -8% 0px' });
    panels.forEach(p => io.observe(p));
  } else { gsap.set(panels, { opacity:1 }); }
  return panels;
}




/* =====================================================================
   CHANNEL FEED — optional. With an API key the documentaries section
   mirrors the channel; without one it falls back to the curated list.
   ===================================================================== */
async function loadChannelFeed(){
  const { config } = NAVIDIX;
  const y = config.youtube;
  if (!y || !y.apiKey || !y.channelId) return;

  const uploads = 'UU' + y.channelId.slice(2);
  const base = 'https://www.googleapis.com/youtube/v3/';

  try {
    const r1 = await fetch(base + 'playlistItems?part=snippet&maxResults=' + y.max +
                           '&playlistId=' + uploads + '&key=' + y.apiKey);
    if (!r1.ok) throw new Error('playlistItems ' + r1.status);
    const d1 = await r1.json();
    const items = (d1.items || [])
      .map(it => it.snippet)
      .filter(sn => sn && sn.resourceId && sn.resourceId.videoId);
    if (!items.length) return;

    const ids = items.map(sn => sn.resourceId.videoId);
    let times = {};
    try {
      const r2 = await fetch(base + 'videos?part=contentDetails&id=' + ids.join(',') + '&key=' + y.apiKey);
      if (r2.ok){
        const d2 = await r2.json();
        (d2.items || []).forEach(v => { times[v.id] = iso8601(v.contentDetails.duration); });
      }
    } catch(e){ /* durations are optional */ }

    config.films = items.map(sn => {
      const one = { t: sn.title, d: trim(sn.description) };
      return { id: sn.resourceId.videoId, time: times[sn.resourceId.videoId] || null, en: one, fa: one };
    });
    NAVIDIX.renderFilms(config.films);
    Lang.repaint();
  } catch(err){
    console.warn('[navidix] channel feed unavailable, using the curated list —', err.message);
  }

  function trim(text){
    const first = (text || '').split('\n').find(l => l.trim().length > 30) || '';
    return first.length > 170 ? first.slice(0, 167).trim() + '…' : first.trim();
  }
  function iso8601(v){
    const m = /PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(v || '');
    if (!m) return null;
    const h = +(m[1]||0), mi = +(m[2]||0), se = +(m[3]||0);
    const pad = n => String(n).padStart(2,'0');
    return h ? h + ':' + pad(mi) + ':' + pad(se) : mi + ':' + pad(se);
  }
}

/* =====================================================================
   VIEWS — each portal opens into its own screen, over the galaxy.
   Register a section id here and the matching portal becomes live.
   ===================================================================== */
const Views = (() => {
  /* one line per section — add an id here and its portal goes live */
  const routes = {
    documentaries:'films', gallery:'gallery',
    training:'training', collections:'collections', social:'socials'
  };
  const root = document.getElementById('view');
  const scroll = document.getElementById('viewScroll');
  let current = null, opener = null;

  function open(sectionId, fromEl, push){
    const target = routes[sectionId];
    if (!target || current === sectionId) return;
    opener = fromEl || null;
    current = sectionId;

    [...scroll.querySelectorAll('.band')].forEach(b => { b.hidden = (b.id !== target); });
    root.hidden = false;
    NAVIDIX.state.viewOpen = true;
    document.body.classList.add('view-open');
    scroll.scrollTop = 0;
    /* a real history entry, so the phone's Back gesture closes the portal
       rather than leaving the site */
    if (push !== false) history.pushState({ nvx:sectionId }, '', '#' + sectionId);

    if (NAVIDIX.state.reduced) return;
    gsap.fromTo('.view__scrim', { opacity:0 }, { opacity:1, duration:.5, ease:'power2.out' });
    gsap.fromTo('#viewScroll', { opacity:0, y:34, filter:'blur(14px)' },
      { opacity:1, y:0, filter:'blur(0px)', duration:.9, ease:'power3.out', clearProps:'filter' });
    gsap.fromTo('.view__close', { opacity:0, scale:.7 },
      { opacity:1, scale:1, duration:.6, ease:'back.out(2)', delay:.15 });
  }

  function hide(){
    if (!current) return;
    const done = () => {
      root.hidden = true;
      NAVIDIX.state.viewOpen = false;
      document.body.classList.remove('view-open');
      current = null;
      if (opener) { opener.focus({ preventScroll:true }); opener = null; }
    };
    if (NAVIDIX.state.reduced) return done();
    gsap.to('#viewScroll', { opacity:0, y:22, duration:.35, ease:'power2.in' });
    gsap.to('.view__scrim', { opacity:0, duration:.4, ease:'power2.in', onComplete:done });
  }

  /* closing by button or Esc walks history back, so Back and the × agree */
  function close(){
    if (!current) return;
    if (history.state && history.state.nvx) history.back();
    else { hide(); history.replaceState(null, '', location.pathname + location.search); }
  }

  addEventListener('popstate', () => {
    const id = location.hash.replace('#','');
    if (current && id !== current) hide();
    if (!current && routes[id]) open(id, null, false);
  });

  root.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', close));
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  return { open, close, has: id => !!routes[id],
    fromHash(){ const id = location.hash.replace('#',''); if (routes[id]) open(id, null, false); } };
})();

/* =====================================================================
   BOOT
   ===================================================================== */
(function boot(){
  const { config, state } = NAVIDIX;
  const { scene } = Stage.init();

  buildStarfield(scene);
  buildNebulae(scene);
  buildDust(scene);
  buildStreaks(scene);
  const mark = buildMark(scene);
  const panels = buildDeck();
  buildBands();
  Lang.init(panels);

  const wm = document.getElementById('wordmark');
  if (config.assets.wordmark && config.assets.wordmark.indexOf('__') !== 0) wm.src = config.assets.wordmark;
  else wm.remove();

  addEventListener('pointermove', e => {
    state.pointer.tx = (e.clientX/innerWidth - .5)*2;
    state.pointer.ty = (e.clientY/innerHeight - .5)*2;
  }, { passive:true });

  let frame = 0;
  function tick(){
    requestAnimationFrame(tick);
    if (!state.running) return;
    frame++;
    if (state.viewOpen){
      if (state.lite) return;      // phone: freeze the field entirely
      if (frame % 2) return;       // desktop: half rate behind the scrim
    }
    const dt = state.clock.getDelta(), t = state.clock.elapsedTime;
    Stage.watch(dt);
    state.pointer.x += (state.pointer.tx - state.pointer.x)*.045;
    state.pointer.y += (state.pointer.ty - state.pointer.y)*.045;
    NAVIDIX.each(m => m.update && m.update(t, dt));
    if (!state.reduced){
      const c = Stage.camera;
      c.position.x += (state.pointer.x*40 - c.position.x)*.02;
      c.position.y += (-state.pointer.y*24 - c.position.y)*.02;
      c.lookAt(0, mark.baseY*0.35 || 0, 0);
    }
    Stage.render();
  }
  tick();

  let played = false;
  function play(){
    if (played) return; played = true;
    mark.fit();
    const stars = NAVIDIX.find('starfield'), neb = NAVIDIX.find('nebulae'), dust = NAVIDIX.find('dust');

    gsap.to('#curtainBar', { width:'100%', duration:.5, ease:'power2.inOut' });
    const tl = gsap.timeline({ delay:.3 });

    tl.to('#curtain', { autoAlpha:0, duration:.9, ease:'power2.inOut',
      onComplete(){ const c = document.getElementById('curtain'); c && c.remove(); } }, 0);

    tl.to(stars.material.uniforms.uOpacity, { value:1, duration:2.6, ease:'power2.out' }, 0);
    if (!state.reduced) tl.to(Stage.camera.position, { z:config.camZ, duration:3.4, ease:'power3.out' }, 0);
    neb.layers.forEach((l,i)=> tl.to(l.mat.uniforms.uOpacity, { value:l.target, duration:3.2, ease:'power2.out' }, .25+i*.22));
    tl.to(dust.material.uniforms.uOpacity, { value:1, duration:2.4, ease:'power2.out' }, .9);

    tl.to(mark.well.material,  { opacity:.80, duration:1.8, ease:'power2.out' }, 1.0);
    mark.fades.forEach(({m,o}) => tl.to(m, { opacity:o, duration:1.6, ease:'power2.out' }, 1.15));
    tl.fromTo(mark.group.scale,
      { x:mark.scale*.7, y:mark.scale*.7, z:mark.scale*.7 },
      { x:mark.scale, y:mark.scale, z:mark.scale, duration:2.1, ease:'power3.out' }, 1.15);
    mark.bloomBase = 0;
    tl.to(mark, { bloomBase:.30, duration:2.2, ease:'power2.out' }, 1.2);
    tl.to(mark.bloomInner.material, { opacity:.46, duration:2.2, ease:'power2.out' }, 1.2);

    tl.fromTo('#wordmark', { opacity:0, y:22, filter:'blur(16px)' },
      { opacity:1, y:0, filter:'blur(0px)', duration:1.8, ease:'power3.out', clearProps:'filter' }, 1.95);
    tl.fromTo('#tagline', { opacity:0, y:12 }, { opacity:1, y:0, duration:1.3, ease:'power3.out' }, 2.35);
    tl.to('#hairline', { scaleX:1, duration:1.6, ease:'power3.out' }, 2.55);
    tl.fromTo('.pitch', { opacity:0, y:14, filter:'blur(10px)' },
      { opacity:1, y:0, filter:'blur(0px)', duration:1.3, ease:'power3.out', clearProps:'filter' }, 2.8);
    tl.fromTo('.hcta', { opacity:0, y:16 },
      { opacity:1, y:0, duration:1.1, ease:'power3.out', stagger:.1 }, 3.05);
    tl.to('#lang', { opacity:1, duration:1.2, ease:'power2.out' }, 2.5);

    tl.to('#cue', { opacity:1, duration:1.2, ease:'power2.out' }, 3.3);
  }

  loadChannelFeed();
  Views.fromHash();
  addEventListener('hashchange', () => Views.fromHash());

  mark.ready = play;
  setTimeout(play, 4500);
})();
</script>
